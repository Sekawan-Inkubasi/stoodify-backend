info:
  name: Update Schedule
  type: http
  seq: 5
http:
  method: PATCH
  url: "{{baseUrl}}/schedules/{{scheduleId}}"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: |
      {
        "room": "Lab Jaringan 1",
        "notes": "Pindah ruangan"
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Update jadwal
