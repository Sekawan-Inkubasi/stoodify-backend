info:
  name: Get Current User Auth Me
  type: http
  seq: 4
http:
  method: GET
  url: "{{baseUrl}}/auth/me"
  headers:
    - name: Accept
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Cek user aktif
