info:
  name: Get Notifications
  type: http
  seq: 1
http:
  method: GET
  url: "{{baseUrl}}/notifications/"
  headers:
    - name: Accept
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Daftar notifikasi
