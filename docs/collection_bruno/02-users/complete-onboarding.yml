info:
  name: Complete Onboarding
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/users/me/onboarding"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: |
      {
        "school": "SMK Telkom Sidoarjo",
        "grade": 10,
        "major": "SIJA"
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Lengkapi sekolah/kelas/jurusan (wajib untuk akun Google).
