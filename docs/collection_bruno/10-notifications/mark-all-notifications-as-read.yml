info:
  name: Mark All Notifications as Read
  type: http
  seq: 3
http:
  method: PATCH
  url: "{{baseUrl}}/notifications/read-all"
  headers:
    - name: Accept
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Tandai semua dibaca
