info:
  name: Logout
  type: http
  seq: 5
http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: |
      {
        "refresh_token": "{{refreshToken}}"
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Logout pengguna
