http:
  method: PATCH
  url: "{{baseUrl}}/tasks/{{taskId}}"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: |
      {
        "title": "Laporan Praktikum (Revisi)",
        "estimated_duration": 90,
        "difficulty": 3
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
