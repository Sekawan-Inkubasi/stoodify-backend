info:
  name: Request Password Reset
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/password-reset/request"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: |
      {
        "email": "naufal@student.id"
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Minta token reset password (respons seragam untuk email terdaftar/tidak)
