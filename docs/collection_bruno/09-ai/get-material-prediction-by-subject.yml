info:
  name: Get Material Prediction by Subject
  type: http
  seq: 7
http:
  method: GET
  url: "{{baseUrl}}/ai/material-predictions/{{subjectId}}"
  headers:
    - name: Accept
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Lihat prediksi materi
