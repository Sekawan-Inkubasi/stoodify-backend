info:
  name: Create Activity
  type: http
  seq: 2
http:
  method: POST
  url: "{{baseUrl}}/activities/"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: |
      {
        "title": "Latihan Ekstrakurikuler Robotik",
        "activity_date": "2026-10-31",
        "start_time": "15:30",
        "end_time": "17:30",
        "recurrence": "Weekly"
      }
scripts:
  res: |
    if (res.body && res.body.data && res.body.data.id) {
      bru.setEnvVar('activityId', res.body.data.id);
    }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Tambah kesibukan rutin
