name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: stoodify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stoodify_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:testpass@localhost:5432/stoodify_test?sslmode=disable
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test, Vet, and Check Formatting
        run: |
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...

      - name: Test Docker Production Build
        run: |
          docker build -t stoodify-backend:test .
