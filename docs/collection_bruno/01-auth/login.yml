info:
  name: Login
  type: http
  seq: 2
http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: none
  body:
    type: json
    data: |
      {
        "email": "siswa.uji@stoodify.seed",
        "password": "rahasia123"
      }
scripts:
  res: |
    // Token ada di data.access_token (bukan data.tokens) — simpan ke environment.
    if (res.body && res.body.data && res.body.data.access_token) {
      bru.setEnvVar('authToken', res.body.data.access_token);
      bru.setEnvVar('refreshToken', res.body.data.refresh_token);
    }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: |-
  Login dengan email+password. Bisa juga kirim {"id_token": "..."} untuk
  jalur Google (sama dengan POST /auth/google). Akun belum verifikasi -> 403.
