info:
  name: Update Profile
  type: http
  seq: 2
http:
  method: PATCH
  url: "{{baseUrl}}/users/me"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: |
      {
        "name": "Siswa Uji Updated",
        "school": "SMKN 1 Sidoarjo",
        "grade": 12,
        "major": "SIJA"
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Update profil pengguna
