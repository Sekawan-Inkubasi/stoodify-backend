info:
  name: Update Topic Progress
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/curriculum/topics/{{topicId}}/progress"
  params:
    - name: topicId
      value: "{{topicId}}"
      type: path
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: |
      {
        "status": "in_progress",
        "notes": "Sudah paham substitusi"
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Update progres belajar topik (not_started/in_progress/mastered)
