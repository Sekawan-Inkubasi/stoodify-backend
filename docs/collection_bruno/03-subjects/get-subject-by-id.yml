info:
  name: Get Subject by ID
  type: http
  seq: 3
http:
  method: GET
  url: "{{baseUrl}}/subjects/{{subjectId}}"
  headers:
    - name: Accept
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
