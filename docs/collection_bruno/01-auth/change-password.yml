info:
  name: Change Password
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/auth/password/change"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: |
      {
        "current_password": "rahasia123",
        "new_password": "rahasia12345",
        "confirm_password": "rahasia12345"
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Ganti password (semua sesi lama dicabut)
