info:
  name: Health Check
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/health"
  headers:
    - name: Accept
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Cek server hidup (tanpa auth)
