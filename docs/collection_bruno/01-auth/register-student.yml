info:
  name: Register Student
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "name": "Siswa Uji Coba",
        "email": "siswa.uji@stoodify.seed",
        "password": "rahasia123",
        "confirm_password": "rahasia123",
        "school": "SMKN 1 Sidoarjo",
        "grade": 12,
        "major": "SIJA"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

