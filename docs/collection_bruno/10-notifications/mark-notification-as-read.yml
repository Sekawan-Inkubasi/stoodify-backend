info:
  name: Mark Notification as Read
  type: http
  seq: 2
http:
  method: PATCH
  url: "{{baseUrl}}/notifications/{{notificationId}}/read"
  headers:
    - name: Accept
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Tandai notifikasi dibaca
