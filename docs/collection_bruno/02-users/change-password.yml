info:
  name: Change Password (users)
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/users/change-password"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: |
      {
        "current_password": "rahasia123",
        "new_password": "rahasia12345",
        "confirm_password": "rahasia12345"
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Alias ganti password di grup users
