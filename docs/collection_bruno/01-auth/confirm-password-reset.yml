info:
  name: Confirm Password Reset
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/auth/password-reset/confirm"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: |
      {
        "token": "ISI_TOKEN_DARI_EMAIL",
        "password": "rahasia12345",
        "confirm_password": "rahasia12345"
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Set password baru dengan token dari email
