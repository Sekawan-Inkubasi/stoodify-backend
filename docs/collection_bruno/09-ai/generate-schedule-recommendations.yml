info:
  name: Generate Schedule Recommendations
  type: http
  seq: 1
http:
  method: POST
  url: "{{baseUrl}}/ai/schedule-recommendations/generate"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: "{}"
scripts:
  res: |
    if (res.body && res.body.data && res.body.data.id) {
      bru.setEnvVar('recommendationId', res.body.data.id);
    }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: |-
  Susun ulang jadwal secara manual (tombol "Susun ulang").
  Jadwal juga disusun otomatis setiap ada perubahan tugas; endpoint ini dibatasi 1x/10 menit.
  - 201: jadwal berubah
  - 200: "Jadwal kamu sudah paling pas" (tidak ada perubahan)
  - 429 + Retry-After: masih dalam masa tunggu
  - 502/503: AI tidak tersedia (jadwal lama tetap dipakai)
