info:
  name: Login Google
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/auth/google"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: |
      {
        "id_token": "{{googleIdToken}}"
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Tukar Google ID token jadi token aplikasi. Balasan berisi needs_onboarding.
