info:
  name: Refresh Token
  type: http
  seq: 3
http:
  method: POST
  url: "{{baseUrl}}/auth/refresh"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: none
  body:
    type: json
    data: |
      {
        "refresh_token": "{{refreshToken}}"
      }
scripts:
  res: |
    if (res.body && res.body.data && res.body.data.access_token) {
      bru.setEnvVar('authToken', res.body.data.access_token);
    }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Perbarui access token
