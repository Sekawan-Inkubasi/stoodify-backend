info:
  name: Generate Schedule Recommendations
  type: http
  seq: 1
http:
  method: POST
  url: "{{baseUrl}}/ai/schedule-recommendations/generate"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: "{}"
scripts:
  res: |
    if (res.body && res.body.data && res.body.data.id) {
      bru.setEnvVar('recommendationId', res.body.data.id);
    }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Generate rekomendasi jadwal AI
