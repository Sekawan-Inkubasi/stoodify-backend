info:
  name: Create Subtask under Task
  type: http
  seq: 2
http:
  method: POST
  url: "{{baseUrl}}/tasks/{{taskId}}/subtasks/"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: bearer
    bearer:
      token: "{{authToken}}"
  body:
    type: json
    data: |
      {
        "title": "Membuat diagram topologi",
        "order_index": 1
      }
scripts:
  res: |
    if (res.body && res.body.data && res.body.data.id) {
      bru.setEnvVar('subtaskId', res.body.data.id);
    }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Tambah subtugas
