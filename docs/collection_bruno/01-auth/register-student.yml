info:
  name: Register Student
  type: http
  seq: 1
http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  headers:
    - name: Accept
      value: application/json
    - name: "Content-Type"
      value: application/json
  auth:
    mode: none
  body:
    type: json
    data: |
      {
        "name": "Siswa Uji Coba",
        "email": "siswa.uji@stoodify.seed",
        "password": "rahasia123",
        "school": "SMKN 1 Sidoarjo",
        "grade": 12,
        "major": "SIJA"
      }
scripts:
  res: |
    if (res.body && res.body.data && res.body.data.tokens) {
      bru.setEnvVar('authToken', res.body.data.tokens.access_token);
      bru.setEnvVar('refreshToken', res.body.data.tokens.refresh_token);
    }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: Mendaftar akun siswa baru
